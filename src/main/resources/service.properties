# Values can be overridden with environment variables or -D system properties
# using the names given in ${NAME:default}
url=${STREP_DB_URL:jdbc:mysql://localhost:3306/strep}
user=${STREP_DB_USER:springuser}
password=${STREP_DB_PASSWORD:changeme}

#Variable used to indicate where the datasets are stored
datasetStorage=${STREP_DATASET_STORAGE:/var/lib/strep/datasets/}

#Variable used to indicate where the pipelines are stored
pipelineStorage=${STREP_PIPELINE_STORAGE:/var/lib/strep/pipelines/}

#Variable used to indicate where the csv are stored
outputStorage=${STREP_CSV_STORAGE:/var/lib/strep/csv/}
